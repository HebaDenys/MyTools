name: Clean merged branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mytools-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'HebaDenys/MyTools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test test/branch-cleanup.test.mjs
      - name: Remove only verified merged, unchanged, unprotected PR heads
        run: node scripts/cleanup-branches.mjs
        env:
          GH_TOKEN: ${{ github.token }}
