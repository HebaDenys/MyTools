name: Validate and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'
permissions:
  contents: read
concurrency:
  group: mytools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run validate
      - if: matrix.node == '22'
        run: git rev-parse HEAD > dist/BUILD_COMMIT.txt
      - name: Save verifiable source and offline build for inspection
        if: matrix.node == '22'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mytools-verification
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/
            packages/
            scripts/
            test/
            docs/
            projects/
            .github/
            .gitignore
            .gitattributes
            .editorconfig
            package.json
            LICENSE
            NOTICE
            COMMERCIAL.md
            SECURITY.md
            README.md
            AGENTS.md
            CONTRIBUTING.md
            dist/MyTools.html
            dist/TrueFlow.html
            dist/BUILD_COMMIT.txt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: python3 -m pip install --disable-pip-version-check playwright==1.57.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 test/browser_trueflow.py
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build && npm run package
      - name: Publish a new version without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; increment package.json for a new release."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MyTools $TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            dist/MyTools.html dist/TrueFlow.html "dist/MyTools-$TAG.zip" dist/SHA256SUMS.txt
